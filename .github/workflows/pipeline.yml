name: Pipeline CI/CD

on:
  push:
    branches: [develop, main]

jobs:
  dev:
    name: DEV - lint e testes unitários
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Testes unitários clientes-service
        working-directory: clientes-service
        run: python -m pytest -v --cov=app
      - name: Testes unitários faturas-service
        working-directory: faturas-service
        run: python -m pytest -v --cov=app

  stg:
    name: STG - testes de integração
    needs: dev
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: stg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Arrancar os containers
        run: |
          docker compose up -d --build
          sleep 5
      - name: Testes de integração
        run: python -m pytest -v tests/integracao
      - name: Parar os containers
        if: always()
        run: docker compose down  

  prd:
    name: PRD - smoke tests
    needs: stg
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prd
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Arrancar os containers
        run: |
          docker compose up -d --build
          sleep 5
      - name: Smoke tests
        run: python -m pytest -v tests/smoke
      - name: Parar os containers
        if: always()
        run: docker compose down  